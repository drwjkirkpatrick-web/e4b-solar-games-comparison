<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>STELLAR ASSAULT</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            font-family: 'Courier New', Courier, monospace;
            color: #0ff;
        }

        canvas {
            border: 2px solid #0ff;
            background-color: #000;
            display: block;
            box-shadow: 0 0 20px #0ff, inset 0 0 10px #0ff;
        }

        /* CRT Overlay Effect */
        #crt-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 100;
            /* Scanline effect */
            background: repeating-linear-gradient(
                0deg,
                rgba(0, 0, 0, 0.1),
                rgba(0, 0, 0, 0.1) 1px,
                transparent 2px,
                transparent 3px
            );
            /* Vignette effect */
            box-shadow: inset 0 0 100px rgba(0, 0, 0, 0.8);
        }
    </style>
</head>
<body>

    <div id="crt-overlay"></div>
    <canvas id="gameCanvas"></canvas>

    <script>
        // =====================================================================
        // CORE GAME ENGINE SETUP
        // =====================================================================

        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Set canvas dimensions (16:9 aspect ratio, fixed size for retro feel)
        canvas.width = 800;
        canvas.height = 600;

        // Game State Management
        const GameState = {
            TITLE: 'TITLE',
            PLAY: 'PLAY',
            PAUSED: 'PAUSED',
            GAMEOVER: 'GAMEOVER'
        };

        let gameState = GameState.TITLE;
        let lastTime = 0;
        let score = 0;
        let highScore = localStorage.getItem('stellarHighscore') || 0;
        let waveNumber = 0;
        let scoreMultiplier = 1;
        let isMuted = false;

        // Input Handling
        const keys = {};
        const touchInputs = {};
        let touchStartX = 0;
        let touchStartY = 0;

        // Global Game Arrays
        let player;
        let bullets = [];
        let enemies = [];
        let powerups = [];
        let particles = [];
        let backgroundLayers = [];
        let screenShake = { active: false, intensity: 0, duration: 0 };

        // =====================================================================
        // AUDIO MANAGER (Web Audio API)
        // =====================================================================

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

        /**
         * Plays a synthesized sound effect.
         * @param {string} type - Type of sound ('laser', 'explosion', 'pickup', 'hit', 'boss_warning')
         * @param {number} [frequency=440] - Base frequency
         * @param {number} [duration=0.1] - Duration in seconds
         */
        function playSound(type, frequency = 440, duration = 0.1) {
            if (isMuted || !audioCtx) return;

            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            switch (type) {
                case 'laser':
                    // Sharp, high-pitched square wave
                    oscillator.type = 'square';
                    oscillator.frequency.setValueAtTime(frequency, audioCtx.currentTime);
                    gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
                    break;
                case 'explosion':
                    // Low, rumbling noise (noise oscillator)
                    const noise = audioCtx.createBufferSource();
                    const buffer = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.3, audioCtx.sampleRate);
                    const data = buffer.getChannelData(0);
                    for (let i = 0; i < buffer.length; i++) {
                        data[i] = Math.random() * 2 - 1;
                    }
                    noise.buffer = buffer;
                    noise.connect(gainNode);
                    gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.5);
                    oscillator.start(audioCtx.currentTime);
                    oscillator.stop(audioCtx.currentTime + 0.5);
                    noise.start(audioCtx.currentTime);
                    break;
                case 'pickup':
                    // Bright, ascending arpeggio
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(440, audioCtx.currentTime);
                    oscillator.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.3);
                    gainNode.gain.setValueAtTime(0.4, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.3);
                    break;
                case 'hit':
                    // Low, dissonant thump
                    oscillator.type = 'sawtooth';
                    oscillator.frequency.setValueAtTime(80, audioCtx.currentTime);
                    gainNode.gain.setValueAtTime(0.6, audioCtx.currentTime);
                    gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.2);
                    break;
                case 'boss_warning':
                    // Slow, menacing pulse
                    oscillator.type = 'sine';
                    oscillator.frequency.setValueAtTime(100, audioCtx.currentTime);
                    gainNode.gain.setValueAtTime(0.2, audioCtx.currentTime);
                    oscillator.start(audioCtx.currentTime);
                    oscillator.stop(audioCtx.currentTime + 3);
                    break;
            }
            oscillator.start(audioCtx.currentTime);
            oscillator.stop(audioCtx.currentTime + duration);
        }

        // =====================================================================
        // OBJECT CLASSES
        // =====================================================================

        class GameObject {
            constructor(x, y, w, h, color) {
                this.x = x;
                this.y = y;
                this.w = w;
                this.h = h;
                this.color = color;
                this.active = true;
            }

            draw(ctx) {
                if (!this.active) return;
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.w, this.h);
            }
        }

        class Player extends GameObject {
            constructor() {
                super(canvas.width / 2 - 20, canvas.height - 60, 40, 40, '#0ff');
                this.lives = 3;
                this.speed = 6;
                this.cooldown = 0;
                this.maxCooldown = 10; // Base rate
                this.isInvulnerable = false;
                this.invulnerabilityTimer = 0;
                this.powerups = {
                    rapidFire: false,
                    tripleShot: false,
                    shield: false,
                    extraLife: false
                };
            }

            update() {
                if (gameState !== GameState.PLAY) return;

                // Movement
                let dx = 0;
                if (keys['ArrowLeft'] || keys['a'] || touchInputs['left']) dx -= this.speed;
                if (keys['ArrowRight'] || keys['d'] || touchInputs['right']) dx += this.speed;

                this.x += dx;
                if (this.x < 0) this.x = 0;
                if (this.x > canvas.width - this.w) this.x = canvas.width - this.w;

                // Shooting
                if (keys[' '] && this.cooldown <= 0) {
                    this.shoot();
                    this.cooldown = this.maxCooldown / (this.powerups.rapidFire ? 2 : 1);
                }
                if (this.cooldown > 0) this.cooldown--;

                // Invulnerability Timer
                if (this.isInvulnerable) {
                    this.invulnerabilityTimer--;
                    if (this.invulnerabilityTimer <= 0) {
                        this.isInvulnerable = false;
                    }
                }

                // Draw Engine Flame
                this.drawEngineFlame();
            }

            draw(ctx) {
                // Draw Ship Body
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.moveTo(this.x + this.w / 2, this.y);
                ctx.lineTo(this.x, this.y + this.h);
                ctx.lineTo(this.x + this.w, this.y + this.h);
                ctx.closePath();
                ctx.fill();

                // Flash effect for invulnerability
                if (this.isInvulnerable && Math.floor(Date.now() / 100) % 2 === 0) {
                    ctx.globalAlpha = 0.5;
                } else {
                    ctx.globalAlpha = 1.0;
                }
                ctx.fill();
                ctx.globalAlpha = 1.0;
            }

            drawEngineFlame() {
                // Simple triangle flame
                ctx.fillStyle = '#ff0';
                ctx.beginPath();
                ctx.moveTo(this.x + this.w / 2 - 5, this.y + this.h);
                ctx.lineTo(this.x + this.w / 2 + 5, this.y + this.h);
                ctx.lineTo(this.x + this.w / 2, this.y + this.h + 15);
                ctx.fill();
            }

            shoot() {
                let bulletCount = 1;
                if (this.powerups.tripleShot) bulletCount = 3;

                for (let i = 0; i < bulletCount; i++) {
                    const bullet = new Bullet(
                        this.x + (i * (this.w / 3)) + (i === 1 ? 0 : (i === 0 ? -this.w/3 : this.w/3)),
                        this.y,
                        5, 15, '#0ff', true
                    );
                    bullets.push(bullet);
                }
                playSound('laser');
            }

            takeDamage() {
                if (this.isInvulnerable) return;

                this.lives--;
                this.isInvulnerable = true;
                this.invulnerabilityTimer = 120; // 2 seconds at 60fps
                screenShake.active = true;
                screenShake.intensity = 10;
                screenShake.duration = 15;
                playSound('hit');

                if (this.lives <= 0) {
                    gameOver();
                }
            }

            applyPowerup(type) {
                switch (type) {
                    case 'shield':
                        this.powerups.shield = true;
                        this.invulnerabilityTimer = 600; // 10 seconds
                        break;
                    case 'rapidFire':
                        this.powerups.rapidFire = true;
                        this.maxCooldown = 5;
                        break;
                    case 'tripleShot':
                        this.powerups.tripleShot = true;
                        break;
                    case 'extraLife':
                        this.lives++;
                        playSound('pickup');
                        break;
                }
            }
        }

        class Bullet extends GameObject {
            constructor(x, y, w, h, color, isPlayer) {
                super(x, y, w, h, color);
                this.speed = isPlayer ? 10 : 4;
                this.isPlayer = isPlayer;
                this.damage = isPlayer ? 1 : 1;
            }

            update() {
                this.y -= this.speed;
                if (this.y < 0) this.active = false;
            }
        }

        class Enemy extends GameObject {
            constructor(x, y, w, h, color, hp, scoreValue, pattern = 'straight') {
                super(x, y, w, h, color);
                this.maxHp = hp;
                this.hp = hp;
                this.scoreValue = scoreValue;
                this.pattern = pattern;
                this.speed = 2 + (Math.random() * 1);
                this.targetX = x;
                this.angle = 0;
            }

            update() {
                if (!this.active) return;

                if (this.pattern === 'straight') {
                    this.y += this.speed;
                } else if (this.pattern === 'zigzag') {
                    this.y += this.speed;
                    this.x += Math.sin(this.angle) * 1.5;
                    this.angle += 0.1;
                } else if (this.pattern === 'tank') {
                    this.y += this.speed * 0.5;
                    // Slow movement, but slightly more robust
                }

                // Check if off screen
                if (this.y > canvas.height) {
                    this.active = false;
                    // Player takes damage if enemy passes bottom
                    player.takeDamage();
                }
            }

            draw(ctx) {
                if (!this.active) return;
                // Draw simple geometric shapes for 90s look
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.w, this.h);
                // Draw HP bar
                ctx.fillStyle = '#f00';
                ctx.fillRect(this.x, this.y - 10, this.w, 3);
                ctx.fillStyle = '#0f0';
                ctx.fillRect(this.x, this.y - 10, (this.w / this.maxHp) * this.hp, 3);
            }

            takeDamage(damage) {
                this.hp -= damage;
                if (this.hp <= 0) {
                    this.active = false;
                    score += this.scoreValue * scoreMultiplier;
                    createExplosion(this.x + this.w / 2, this.y + this.h / 2, this.color);
                    // Drop powerup chance
                    if (Math.random() < 0.2) {
                        const types = ['shield', 'rapidFire', 'tripleShot', 'extraLife'];
                        const randomType = types[Math.floor(Math.random() * types.length)];
                        powerups.push(new Powerup(this.x + this.w/2, this.y + this.h/2, randomType));
                    }
                }
            }
        }

        class Powerup extends GameObject {
            constructor(x, y, type) {
                super(x - 10, y - 10, 20, 20, '#fff');
                this.type = type;
                this.speed = 2;
            }

            update() {
                this.y += this.speed;
                if (this.y > canvas.height) {
                    this.active = false;
                }
            }

            draw(ctx) {
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.w, this.h);
                // Draw a symbol for the powerup
                ctx.fillStyle = '#000';
                ctx.fillRect(this.x + 5, this.y + 5, 10, 10);
            }
        }

        // =====================================================================
        // PARTICLES & EFFECTS
        // =====================================================================

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.size = Math.random() * 3 + 1;
                this.life = 1.0;
                this.vx = (Math.random() - 0.5) * 3;
                this.vy = (Math.random() - 0.5) * 3;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.life -= 0.03;
                this.size *= 0.95;
            }

            draw(ctx) {
                ctx.globalAlpha = this.life;
                ctx.fillStyle = this.color;
                ctx.fillRect(this.x, this.y, this.size, this.size);
                ctx.globalAlpha = 1.0;
            }
        }

        function createExplosion(x, y, color) {
            for (let i = 0; i < 20; i++) {
                particles.push(new Particle(x, y, color));
            }
        }

        // =====================================================================
        // BACKGROUND & ENVIRONMENT
        // =====================================================================

        class StarField {
            constructor(count, speed, color) {
                this.stars = [];
                this.count = count;
                this.speed = speed;
                this.color = color;
                for (let i = 0; i < count; i++) {
                    this.stars.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        size: Math.random() * 2,
                        speed: Math.random() * 0.5 + 0.5
                    });
                }
            }

            update() {
                this.stars.forEach(star => {
                    star.y += this.speed * this.stars[0].speed;
                    if (star.y > canvas.height) {
                        star.y = 0;
                        star.x = Math.random() * canvas.width;
                    }
                });
            }

            draw(ctx) {
                this.stars.forEach(star => {
                    ctx.fillStyle = this.color;
                    ctx.fillRect(star.x, star.y, star.size, star.size);
                });
            }
        }

        function initializeBackground() {
            // 3 Parallax Layers
            backgroundLayers = [
                new StarField(100, 0.2, '#fff'), // Slowest
                new StarField(300, 0.8, '#aaa'), // Medium
                new StarField(600, 1.5, '#fff')  // Fastest
            ];
        }

        // =====================================================================
        // GAME LOGIC FUNCTIONS
        // =====================================================================

        function spawnEnemy(type) {
            let x = Math.random() * (canvas.width - 60) + 30;
            let y = -50;
            let w = 30;
            let h = 30;
            let color = '#f0f';
            let hp = 1;
            let scoreValue = 10;
            let pattern = 'straight';

            if (type === 'grunt') {
                w = 30; h = 30; color = '#f0f'; hp = 1; scoreValue = 10; pattern = 'straight';
            } else if (type === 'zigzag') {
                w = 35; h = 35; color = '#f00'; hp = 1; scoreValue = 20; pattern = 'zigzag';
            } else if (type === 'tank') {
                w = 50; h = 50; color = '#0f0'; hp = 3; scoreValue = 50; pattern = 'tank';
            } else if (type === 'boss') {
                w = 150; h = 150; color = '#ff0'; hp = 10; scoreValue = 500; pattern = 'straight';
            }

            const enemy = new Enemy(x, y, w, h, color, hp, scoreValue, pattern);
            enemies.push(enemy);
        }

        function spawnWave() {
            waveNumber++;
            let enemiesToSpawn = 5 + waveNumber * 2;
            let spawnTypes = ['grunt', 'grunt', 'zigzag', 'tank'];

            if (waveNumber % 5 === 0) {
                spawnTypes = ['boss'];
                enemiesToSpawn = 1;
            } else {
                // Randomly select from the pool
                spawnTypes = [];
                for (let i = 0; i < enemiesToSpawn; i++) {
                    const typeIndex = Math.floor(Math.random() * spawnTypes.length);
                    spawnTypes.push(spawnTypes[typeIndex]);
                }
            }

            spawnTypes.forEach(type => spawnEnemy(type));
        }

        function updateGame() {
            if (gameState !== GameState.PLAY) return;

            // 1. Update Player
            player.update();

            // 2. Update Background
            backgroundLayers.forEach(layer => layer.update());

            // 3. Update Bullets
            bullets.forEach(bullet => bullet.update());
            bullets = bullets.filter(bullet => bullet.active);

            // 4. Update Enemies
            enemies.forEach(enemy => enemy.update());

            // 5. Update Powerups
            powerups.forEach(p => p.update());
            powerups = powerups.filter(p => p.active);

            // 6. Update Particles
            particles.forEach(p => p.update());
            particles = particles.filter(p => p.life > 0);

            // 7. Collision Detection
            handleCollisions();

            // 8. Wave Management
            if (enemies.length === 0 && waveNumber > 0) {
                // Wait a moment before next wave
                setTimeout(spawnWave, 2000);
            } else if (waveNumber === 0) {
                // Start first wave after title screen
                spawnWave();
            }

            // 9. Score Multiplier Check
            const newMultiplier = Math.floor(score / 1000) + 1;
            if (newMultiplier > scoreMultiplier) {
                scoreMultiplier = newMultiplier;
            }
        }

        function handleCollisions() {
            // Player Bullets vs Enemies
            bullets.forEach(bullet => {
                if (!bullet.isPlayer) return;
                enemies.forEach(enemy => {
                    if (isColliding(bullet, enemy)) {
                        enemy.takeDamage(bullet.damage);
                        bullet.active = false;
                    }
                });
            });

            // Enemy Bullets vs Player (Simplified: check all bullets)
            bullets.forEach(bullet => {
                if (bullet.isPlayer) return;
                if (isColliding(bullet, player)) {
                    if (player.powerups.shield) {
                        bullet.active = false;
                        playSound('pickup'); // Shield absorbs hit
                    } else {
                        // Player takes damage
                        player.takeDamage();
                        bullet.active = false;
                    }
                }
            });

            // Player vs Powerups
            powerups.forEach(p => {
                if (isColliding(player, p)) {
                    p.active = false;
                    player.applyPowerup(p.type);
                    playSound('pickup');
                }
            });
        }

        function isColliding(obj1, obj2) {
            return obj1.x < obj2.x + obj2.w &&
                   obj1.x + obj1.w > obj2.x &&
                   obj1.y < obj2.y + obj2.h &&
                   obj1.y + obj1.h > obj2.y;
        }

        // =====================================================================
        // DRAW LOOP
        // =====================================================================

        function draw() {
            // Clear canvas
            ctx.fillStyle = '#000';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Apply Screen Shake
            let offsetX = 0;
            let offsetY = 0;
            if (screenShake.active) {
                offsetX = (Math.random() - 0.5) * screenShake.intensity;
                offsetY = (Math.random() - 0.5) * screenShake.intensity;
                screenShake.duration--;
                if (screenShake.duration <= 0) {
                    screenShake.active = false;
                }
            }

            ctx.save();
            ctx.translate(offsetX, offsetY);

            // 1. Draw Background (Parallax)
            backgroundLayers.forEach(layer => layer.draw(ctx));

            // 2. Draw Game Objects
            enemies.forEach(enemy => enemy.draw(ctx));
            bullets.forEach(bullet => bullet.draw(ctx));
            powerups.forEach(p => p.draw(ctx));
            particles.forEach(p => p.draw(ctx));
            player.draw(ctx);

            // 3. Draw UI (HUD)
            drawHUD();

            ctx.restore();
        }

        function drawHUD() {
            ctx.fillStyle = '#0ff';
            ctx.font = '18px monospace';

            // Score and Multiplier (Top Left)
            ctx.fillText(`SCORE: ${score} x${scoreMultiplier}`, 10, 30);

            // Lives (Top Right)
            ctx.fillStyle = '#fff';
            for (let i = 0; i < player.lives; i++) {
                ctx.fillRect(canvas.width - 100 + (i * 25), 10, 20, 20);
            }

            // Wave Number (Center Top)
            ctx.fillStyle = '#f0f';
            ctx.font = '22px monospace';
            ctx.textAlign = 'center';
            ctx.fillText(`WAVE: ${waveNumber}`, canvas.width / 2, 40);
            ctx.textAlign = 'left'; // Reset alignment
        }

        function gameLoop(timestamp) {
            const deltaTime = timestamp - lastTime;
            lastTime = timestamp;

            if (gameState === GameState.PLAY) {
                updateGame();
            }

            draw();

            requestAnimationFrame(gameLoop);
        }

        // =====================================================================
        // STATE HANDLERS
        // =====================================================================

        function resetGame() {
            score = 0;
            waveNumber = 0;
            scoreMultiplier = 1;
            player = new Player();
            bullets = [];
            enemies = [];
            powerups = [];
            particles = [];
            screenShake = { active: false, intensity: 0, duration: 0 };
            
            // Ensure audio context is running
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            gameState = GameState.PLAY;
        }

        function startGame() {
            if (gameState === GameState.TITLE || gameState === GameState.GAMEOVER) {
                resetGame();
            }
        }

        function pauseGame() {
            if (gameState === GameState.PLAY) {
                gameState = GameState.PAUSED;
            } else if (gameState === GameState.PAUSED) {
                gameState = GameState.PLAY;
            }
        }

        function gameOver() {
            gameState = GameState.GAMEOVER;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('stellarHighscore', highScore);
            }
        }

        function drawTitleScreen() {
            ctx.fillStyle = '#0ff';
            ctx.font = '60px monospace';
            ctx.textAlign = 'center';
            ctx.fillText('STELLAR ASSAULT', canvas.width / 2, 150);

            ctx.fillStyle = '#fff';
            ctx.font = '24px monospace';
            ctx.fillText('PRESS SPACE TO START', canvas.width / 2, 300);

            ctx.fillStyle = '#f0f';
            ctx.font = '18px monospace';
            ctx.fillText(`HIGH SCORE: ${highScore}`, canvas.width / 2, 350);
            ctx.font = '14px monospace';
            ctx.fillText('Use WASD/Arrows to Move | Space to Shoot | P to Pause | M to Mute', canvas.width / 2, 400);
        }

        function drawGameOverScreen() {
            ctx.fillStyle = '#f00';
            ctx.font = '80px monospace';
            ctx.textAlign = 'center';
            ctx.fillText('GAME OVER', canvas.width / 2, 250);

            ctx.fillStyle = '#0ff';
            ctx.font = '40px monospace';
            ctx.fillText(`FINAL SCORE: ${score}`, canvas.width / 2, 350);

            ctx.fillStyle = '#fff';
            ctx.font = '20px monospace';
            ctx.fillText('Press Space to Restart', canvas.width / 2, 450);
        }

        function drawPausedScreen() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#fff';
            ctx.font = '40px monospace';
            ctx.textAlign = 'center';
            ctx.fillText('PAUSED', canvas.width / 2, canvas.height / 2);
        }

        // =====================================================================
        // INPUT LISTENERS
        // =====================================================================

        window.addEventListener('keydown', (e) => {
            keys[e.key] = true;
            if (e.key === ' ' && gameState !== GameState.TITLE && gameState !== GameState.GAMEOVER) {
                e.preventDefault(); // Prevent scrolling
            }
            if (e.key === 'm') {
                isMuted = !isMuted;
                console.log(`Audio Muted: ${isMuted}`);
            }
            if (e.key === 'p') {
                pauseGame();
            }

            if (e.key === ' ' && gameState === GameState.TITLE) {
                startGame();
            }
            if (e.key === ' ' && gameState === GameState.GAMEOVER) {
                resetGame();
            }
        });

        window.addEventListener('keyup', (e) => {
            keys[e.key] = false;
        });

        // Touch Input Handling (Mobile)
        canvas.addEventListener('touchstart', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            touchStartX = touch.clientX;
            touchStartY = touch.clientY;

            if (gameState === GameState.TITLE || gameState === GameState.GAMEOVER) {
                startGame();
            }
            if (gameState === GameState.PAUSED) {
                pauseGame();
            }
        });

        canvas.addEventListener('touchmove', (e) => {
            e.preventDefault();
            const touch = e.touches[0];
            const dx = touch.clientX - touchStartX;
            const dy = touch.clientY - touchStartY;

            // Simple directional movement based on swipe direction
            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 10) touchInputs['right'] = true;
                if (dx < -10) touchInputs['left'] = true;
            } else {
                if (dy > 10) touchInputs['down'] = true;
                if (dy < -10) touchInputs['up'] = true;
            }
        });

        canvas.addEventListener('touchend', (e) => {
            // Reset touch inputs when finger lifts
            touchInputs['left'] = false;
            touchInputs['right'] = false;
            touchInputs['up'] = false;
            touchInputs['down'] = false;
        });


        // =====================================================================
        // INITIALIZATION
        // =====================================================================

        function init() {
            initializeBackground();
            // Start the loop, but initial state is TITLE
            requestAnimationFrame(gameLoop);
        }

        init();

    </script>
</body>
</html>
